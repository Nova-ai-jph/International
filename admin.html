<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Banque Internationale</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 20px; }
    
    /* Écran de connexion */
    .login-container { display: flex; justify-content: center; align-items: center; min-height: 90vh; }
    .login-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { margin-bottom: 20px; color: #1e293b; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #64748b; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .btn { padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; width: 100%; }
    .btn:hover { background-color: #1d4ed8; }
    .error-msg { color: #ef4444; font-size: 14px; margin-top: 15px; display: none; }

    /* Tableau de bord */
    .dashboard { display: none; max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
    .btn-logout { background-color: #dc2626; padding: 8px 16px; font-size: 14px; width: auto; }
    .btn-logout:hover { background-color: #b91c1c; }

    /* Tableaux et sections */
    h3 { margin-bottom: 15px; color: #1e293b; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 30px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
    th { background-color: #f8fafc; color: #475569; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
    .badge-pending { background-color: #fef3c7; color: #d97706; }
    .badge-approved { background-color: #dcfce7; color: #16a34a; }
    .badge-rejected { background-color: #fee2e2; color: #dc2626; }
    .action-btn { padding: 6px 10px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px; margin-right: 5px; }
    .btn-approve { background-color: #16a34a; color: white; }
    .btn-reject { background-color: #dc2626; color: white; }
    img.receipt-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 4px; cursor: pointer; border: 1px solid #cbd5e1; }
  </style>
</head>
<body>

  <!-- 1. FORMULAIRE DE CONNEXION -->
  <div class="login-container" id="loginContainer">
    <div class="login-card">
      <h2>Connexion Admin</h2>
      <div class="form-group">
        <label for="email">Adresse E-mail</label>
        <input type="email" id="email" placeholder="admin@banque.com" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="button" class="btn" id="loginBtn">Se connecter</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>
  </div>

  <!-- 2. TABLEAU DE BORD ADMINISTRATEUR -->
  <div class="dashboard" id="dashboardCard">
    <div class="dashboard-header">
      <h2>Tableau de Bord - Banque Internationale</h2>
      <button class="btn btn-logout" id="logoutBtn">Déconnexion</button>
    </div>

    <h3>Demandes de Prêts Reçues (Table : demandes)</h3>
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Client</th>
          <th>Contact / WhatsApp</th>
          <th>Type & Montant</th>
          <th>Reçu</th>
          <th>Statut</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="loansTableBody">
        <tr>
          <td colspan="7" style="text-align: center; color: #64748b;">Chargement des données...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    // --- INITIALISATION SUPABASE ---
    const SUPABASE_URL = "https://ibrbrpctifzrksfsqbiv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0Wbabg9JV5RrfWkm_PoIhw_xyXFNsiy";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Éléments DOM
    const loginContainer = document.getElementById('loginContainer');
    const dashboardCard = document.getElementById('dashboardCard');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const logoutBtn = document.getElementById('logoutBtn');
    const loansTableBody = document.getElementById('loansTableBody');

    // --- VÉRIFICATION DE LA SESSION ---
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showDashboard();
      }
    }
    checkSession();

    // --- CONNEXION ---
    loginBtn.addEventListener('click', async () => {
      errorMsg.style.display = 'none';
      loginBtn.innerText = 'Connexion en cours...';
      loginBtn.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorMsg.innerText = "Erreur : Identifiants ou mot de passe incorrects.";
        errorMsg.style.display = 'block';
        loginBtn.innerText = 'Se connecter';
        loginBtn.disabled = false;
      } else {
        showDashboard();
      }
    });

    // --- DÉCONNEXION ---
    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      loginContainer.style.display = 'flex';
      dashboardCard.style.display = 'none';
      loginBtn.innerText = 'Se connecter';
      loginBtn.disabled = false;
      passwordInput.value = '';
    });

    // --- AFFICHAGE DU TABLEAU DE BORD & CHARGEMENT DES DEMANDES ---
    function showDashboard() {
      loginContainer.style.display = 'none';
      dashboardCard.style.display = 'block';
      loadDemandes();
    }

    async function loadDemandes() {
      const { data, error } = await supabaseClient
        .from('demandes')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        loansTableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: red;">Erreur de chargement : ${error.message}</td></tr>`;
        return;
      }

      if (!data || data.length === 0) {
        loansTableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; color: #64748b;">Aucune demande de prêt pour le moment.</td></tr>`;
        return;
      }

      loansTableBody.innerHTML = '';
      data.forEach(item => {
        const dateStr = item.created_at ? new Date(item.created_at).toLocaleDateString('fr-FR') : 'N/A';
        
        let statusBadge = '<span class="badge badge-pending">En attente</span>';
        if (item.statut === 'Approuvée' || item.statut === 'approved') {
          statusBadge = '<span class="badge badge-approved">Approuvée</span>';
        } else if (item.statut === 'Rejetée' || item.statut === 'rejected') {
          statusBadge = '<span class="badge badge-rejected">Rejetée</span>';
        }

        const receiptHtml = item.piece_jointe 
          ? `<a href="${item.piece_jointe}" target="_blank"><img src="${item.piece_jointe}" class="receipt-thumb" title="Voir le reçu"></a>` 
          : '<span style="color:#94a3b8; font-size:11px;">Aucun</span>';

        const row = `
          <tr>
            <td>${dateStr}</td>
            <td><strong>${item.nom_complet || 'N/A'}</strong><br><small style="color:#64748b;">${item.email || ''}</small></td>
            <td>${item.whatsapp || 'N/A'}</td>
            <td>${item.type_pret || 'Prêt'} <br><strong>${item.montant || ''}</strong></td>
            <td>${receiptHtml}</td>
            <td>${statusBadge}</td>
            <td>
              <button class="action-btn btn-approve" onclick="updateStatus('${item.id}', 'Approuvée')">Valider</button>
              <button class="action-btn btn-reject" onclick="updateStatus('${item.id}', 'Rejetée')">Rejeter</button>
            </td>
          </tr>
        `;
        loansTableBody.innerHTML += row;
      });
    }

    // --- MISE À JOUR DU STATUT ---
    window.updateStatus = async function(id, newStatus) {
      const { error } = await supabaseClient
        .from('demandes')
        .update({ statut: newStatus })
        .eq('id', id);

      if (error) {
        alert("Erreur lors de la mise à jour : " + error.message);
      } else {
        loadDemandes(); // Recharge le tableau en direct
      }
    }
  </script>
</body>
</html>
