<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administration - Banque Internationale</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; color: #333; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    /* Écran de connexion */
    .login-card { background: #ffffff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
    .login-card h2 { margin-bottom: 20px; color: #1e293b; }
    .form-group { margin-bottom: 15px; text-align: left; }
    .form-group label { display: block; font-size: 14px; margin-bottom: 5px; color: #64748b; }
    .form-group input { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; }
    .btn { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background-color: #1d4ed8; }
    .error-msg { color: #ef4444; font-size: 14px; margin-top: 15px; display: none; }

    /* Tableau de bord (masqué par défaut) */
    .dashboard { display: none; width: 100%; max-width: 1000px; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    .dashboard-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
    .btn-logout { background-color: #dc2626; padding: 8px 16px; font-size: 14px; width: auto; }
    .btn-logout:hover { background-color: #b91c1c; }
  </style>
</head>
<body>

  <!-- 1. FORMULAIRE DE CONNEXION -->
  <div class="login-card" id="loginCard">
    <h2>Connexion Admin</h2>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Adresse E-mail</label>
        <input type="email" id="email" placeholder="admin@banque.com" required>
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Se connecter</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>
  </div>

  <!-- 2. TABLEAU DE BORD ADMINISTRATEUR -->
  <div class="dashboard" id="dashboardCard">
    <div class="dashboard-header">
      <h2>Tableau de Bord - Banque Internationale</h2>
      <button class="btn btn-logout" id="logoutBtn">Déconnexion</button>
    </div>
    <p>Bienvenue dans l'espace d'administration sécurisé.</p>
    <!-- Insérez ici vos tableaux, demandes de prêt et filtres -->
  </div>

  <script>
    // --- INITIALISATION SUPABASE ---
    const SUPABASE_URL = "https://ibrbrpctifzrksfsqbiv.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_0Wbabg9JV5RrfWkm_PoIhw_xyXFNsiy";
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Éléments DOM
    const loginCard = document.getElementById('loginCard');
    const dashboardCard = document.getElementById('dashboardCard');
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const loginBtn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');
    const logoutBtn = document.getElementById('logoutBtn');

    // --- VÉRIFICATION DE LA SESSION EXISTANTE ---
    async function checkSession() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        showDashboard();
      }
    }
    checkSession();

    // --- GESTION DE LA CONNEXION ---
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      loginBtn.innerText = 'Connexion en cours...';
      loginBtn.disabled = true;

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorMsg.innerText = "Erreur : " + translateError(error.message);
        errorMsg.style.display = 'block';
        loginBtn.innerText = 'Se connecter';
        loginBtn.disabled = false;
      } else {
        showDashboard();
      }
    });

    // --- GESTION DE LA DÉCONNEXION ---
    logoutBtn.addEventListener('click', async () => {
      await supabaseClient.auth.signOut();
      showLogin();
    });

    // Affichage des vues
    function showDashboard() {
      loginCard.style.display = 'none';
      dashboardCard.style.display = 'block';
    }

    function showLogin() {
      loginCard.style.display = 'block';
      dashboardCard.style.display = 'none';
      loginBtn.innerText = 'Se connecter';
      loginBtn.disabled = false;
      passwordInput.value = '';
    }

    // Traduction simple des erreurs courantes Supabase
    function translateError(msg) {
      if (msg.includes("Invalid login credentials")) return "Identifiants ou mot de passe incorrects.";
      if (msg.includes("Email not confirmed")) return "L'adresse e-mail n'a pas été confirmée.";
      return msg;
    }
  </script>
</body>
</html>
