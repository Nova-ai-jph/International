<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banque International — Simulateur de Prêt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#0a192f', 900: '#020c1b', 950: '#010610' },
                        gold: { 400: '#fbbf24', 500: '#d97706', 600: '#b45309' }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({ pageLanguage: 'fr', autoDisplay: true }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <header class="bg-navy-900 text-white sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-20">
                <a href="index.html" class="flex items-center space-x-3">
                    <div class="w-12 h-12 flex items-center justify-center rounded-lg bg-navy-800 border border-gold-500/30">
                        <i class="fa-solid fa-building-columns text-gold-400 text-2xl"></i>
                    </div>
                    <span class="font-bold text-lg sm:text-xl tracking-wider">BANQUE <span class="text-gold-400">INTERNATIONAL</span></span>
                </a>
                <nav class="hidden lg:flex items-center space-x-6 text-sm font-medium">
                    <a href="index.html" class="hover:text-gold-400">Accueil</a>
                    <a href="solutions.html" class="hover:text-gold-400">Nos solutions</a>
                    <a href="simulateur.html" class="text-gold-400 font-bold">Simulateur</a>
                    <a href="contact.html" class="hover:text-gold-400">Contact</a>
                </nav>
                <div id="google_translate_element" class="hidden lg:block"></div>
            </div>
        </div>
    </header>

    <main class="py-16 bg-white flex-grow">
        <div class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="bg-navy-900 text-white rounded-2xl p-6 sm:p-10 shadow-xl border border-slate-800">
                <div class="text-center mb-8">
                    <h1 class="text-2xl sm:text-3xl font-bold mb-2">Simulateur de prêt interactif</h1>
                    <p class="text-slate-300 text-sm">Devise détectée automatiquement selon votre région : <span id="currency-label" class="text-gold-400 font-bold">EUR (€)</span></p>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
                    <div class="lg:col-span-7 space-y-6">
                        <div>
                            <label class="block text-sm font-medium mb-2 flex justify-between">
                                <span>Montant souhaité</span>
                                <span id="amount-val" class="font-bold text-gold-400">10 000</span>
                            </label>
                            <input type="range" id="sim-amount" min="1000" max="100000" step="1000" value="10000" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-gold-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2 flex justify-between">
                                <span>Durée souhaitée (mois)</span>
                                <span id="duration-val" class="font-bold text-gold-400">36 mois</span>
                            </label>
                            <input type="range" id="sim-duration" min="12" max="120" step="6" value="36" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-gold-500">
                        </div>

                        <div>
                            <label class="block text-sm font-medium mb-2">Type de financement</label>
                            <select id="sim-type" class="w-full bg-navy-950 border border-slate-700 rounded-lg p-3 text-white text-sm">
                                <option value="personnel">Prêt personnel</option>
                                <option value="projet">Prêt pour un projet</option>
                                <option value="immobilier">Prêt immobilier</option>
                                <option value="auto">Prêt automobile</option>
                            </select>
                        </div>
                    </div>

                    <div class="lg:col-span-5 bg-navy-950 p-6 rounded-xl border border-slate-800 space-y-4">
                        <h3 class="text-lg font-semibold text-slate-200 border-b border-slate-800 pb-3">Résultat estimé</h3>
                        
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-400">Montant :</span>
                            <span id="res-amount" class="font-bold">10 000</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-400">Durée :</span>
                            <span id="res-duration" class="font-bold">36 mois</span>
                        </div>
                        <div class="flex justify-between items-center text-sm">
                            <span class="text-slate-400">Coût total du crédit :</span>
                            <span id="res-cost" class="font-bold text-amber-400">--</span>
                        </div>

                        <div class="pt-4 border-t border-slate-800">
                            <span class="text-xs text-slate-400 uppercase tracking-wider block mb-1">Mensualité estimée</span>
                            <div id="res-monthly" class="text-3xl font-extrabold text-gold-400">--</div>
                        </div>

                        <a href="contact.html#demande" class="w-full bg-gold-500 hover:bg-gold-600 text-navy-950 font-bold py-3 rounded-lg transition shadow text-center block text-sm mt-4">
                            Continuer ma demande
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Détection automatique de la devise internationale selon le système/navigateur du client
        let userCurrency = "€";
        let currencyCode = "EUR";

        function detectUserCurrency() {
            try {
                const lang = navigator.language || 'fr-FR';
                if (lang.includes('MX') || lang.includes('es-MX')) { userCurrency = "$ MXN"; currencyCode = "MXN"; }
                else if (lang.includes('US') || lang.includes('en-US')) { userCurrency = "$ USD"; currencyCode = "USD"; }
                else if (lang.includes('CA') || lang.includes('en-CA')) { userCurrency = "$ CAD"; currencyCode = "CAD"; }
                else if (lang.includes('GB') || lang.includes('en-GB')) { userCurrency = "£"; currencyCode = "GBP"; }
                else if (lang.includes('JP') || lang.includes('ja')) { userCurrency = "¥"; currencyCode = "JPY"; }
                else { userCurrency = "€"; currencyCode = "EUR"; }
            } catch(e) {
                userCurrency = "€";
            }
            document.getElementById('currency-label').textContent = `${currencyCode} (${userCurrency})`;
        }

        detectUserCurrency();

        const amountInput = document.getElementById('sim-amount');
        const durationInput = document.getElementById('sim-duration');

        function calculateLoan() {
            const P = parseFloat(amountInput.value);
            const n = parseInt(durationInput.value);
            const r = 0.05 / 12;

            const monthlyPayment = (P * r) / (1 - Math.pow(1 + r, -n));
            const totalRepaid = monthlyPayment * n;
            const totalCost = totalRepaid - P;

            document.getElementById('amount-val').textContent = P.toLocaleString() + ' ' + userCurrency;
            document.getElementById('duration-val').textContent = n + ' mois';

            document.getElementById('res-amount').textContent = P.toLocaleString() + ' ' + userCurrency;
            document.getElementById('res-duration').textContent = n + ' mois';
            document.getElementById('res-monthly').textContent = monthlyPayment.toFixed(2) + ' ' + userCurrency + ' / mois';
            document.getElementById('res-cost').textContent = Math.round(totalCost).toLocaleString() + ' ' + userCurrency;
        }

        amountInput.addEventListener('input', calculateLoan);
        durationInput.addEventListener('input', calculateLoan);
        calculateLoan();
    </script>
</body>
</html>
